# SPDX-License-Identifier: MPL-2.0
# GitHub Pages: the Mathesis atlas site (re-anchoring plan WO 4.3).
# The site is built by `just site` (scripts/site/site.mjs) inside the pinned
# Guix shell (build/channels.scm, build/manifest.scm), then deployed with the
# official Pages actions, each pinned to a full commit SHA.
# Owner step (once): Settings, Pages, Source set to GitHub Actions.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the build job only reads; only the deploy job may write Pages.
permissions:
  contents: read

# Serialise Pages deploys; never cancel an in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  GUIX_VERSION: "1.5.0"
  # SHA-256 of guix-binary-1.5.0.x86_64-linux.tar.xz (same pin as agda-proof-policy.yml).
  GUIX_SHA256: "aa41025489c5061543e9c48873eaa829b900b2da75d40f9648913622f5f47817"
  BUN_VERSION: "1.4.4"
  BUN_SHA256: "bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c"

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Guix (checksum-pinned binary release)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://ftp.gnu.org/gnu/guix/guix-binary-${GUIX_VERSION}.x86_64-linux.tar.xz" --output guix.tar.xz
          echo "${GUIX_SHA256}  guix.tar.xz" | sha256sum --check --strict
          sudo tar --warning=no-timestamp -xf guix.tar.xz -C /
          sudo groupadd --system guixbuild
          for i in 1 2 3 4; do
            sudo useradd -g guixbuild -G guixbuild -d /var/empty -s /usr/sbin/nologin \
              -c "Guix build user $i" --system "guixbuilder$i"
          done
          G=/var/guix/profiles/per-user/root/current-guix
          sudo sh -c "nohup $G/bin/guix-daemon --build-users-group=guixbuild > /var/log/guix-daemon.log 2>&1 &"
          for _ in $(seq 30); do [ -S /var/guix/daemon-socket/socket ] && break; sleep 1; done
          [ -S /var/guix/daemon-socket/socket ] || { sudo cat /var/log/guix-daemon.log; exit 1; }
          sudo "$G/bin/guix" archive --authorize < "$G/share/guix/ci.guix.gnu.org.pub"
          sudo "$G/bin/guix" archive --authorize < "$G/share/guix/bordeaux.guix.gnu.org.pub"
          echo "$G/bin" >> "$GITHUB_PATH"

      - name: Install Bun (checksum-pinned release archive)
        run: |
          set -euo pipefail
          b="$RUNNER_TEMP/site-bin"; mkdir -p "$b"; cd "$RUNNER_TEMP"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip" --output bun.zip
          echo "${BUN_SHA256}  bun.zip" | sha256sum --check --strict
          unzip -q -j bun.zip bun-linux-x64/bun -d "$b"
          echo "$b" >> "$GITHUB_PATH"

      # The same recipe `just site OUT` runs: it fails on any Asciidoctor
      # warning and on any broken relative link, and needs an absent or empty OUT.
      - name: Build the site in the pinned Guix shell
        run: |
          guix time-machine -C build/channels.scm -- shell -m build/manifest.scm -- \
            bun scripts/site/site.mjs build "$GITHUB_WORKSPACE/_site"

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
